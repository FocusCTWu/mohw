        <div class="p-5 border-b border-slate-200 bg-blue-700 text-white flex justify-between items-center">

        <div id="upload-container" class="p-4 border-b border-slate-200 bg-amber-50">

                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-amber-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span>系統正在載入最新資料...</span>

                <div>
                    <label class="block text-xs text-slate-500 mb-1">備援：上傳機構名單 (CSV)</label>

                    <span id="resultHint" class="text-sm text-slate-500 font-normal mt-1 leading-relaxed hidden">建議您減少勾選特定的服務項目，或選擇「全台灣」來尋找其他縣市的資源。</span>

                <button id="resetBtn" class="w-full py-2.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-medium rounded-md transition-colors text-base shadow-sm">重新設定篩選條件</button>

                <p>資料來源：衛福部心健司 - 物質使用障礙症治療及生活重建業務指定機構名單</p>

    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/50 z-[1000] hidden md:hidden transition-opacity"></div>

    <script nonce="EDNENVB34928">
        window.DATA_CONFIG = {
            csvUrl: './drug_org_list_all_1150313.csv', 
            geoJsonUrl: './COUNTY_MOI_1140318.json',
            maxFileSize: 2 * 1024 * 1024,
            maxStringLength: 150
        };

        function sanitizeText(str) {
            if (str === null || str === undefined) return '';
            let s = Array.from(String(str)).slice(0, window.DATA_CONFIG.maxStringLength).join(''); 
            return s.replace(/[&<>"']/g, function(match) {
                const escapeMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
                return escapeMap[match];
            });
        }

        function getServiceDisplayName(rawKey) {
            let displayName = rawKey.replace('藥癮_', '').replace('酒癮_', '');
    
            const customNames = {
                '維持治療_美沙冬': '美沙冬維持治療',
                '維持治療_丁基原啡因': '丁基原啡因維持治療',
                '美沙冬跨區給藥': '美沙冬跨區給藥服務',
                '美沙冬給藥點': '美沙冬給藥點',
                '藥物治療': '藥物治療',
                '心理治療': '心理治療',
                '生活重建': '生活重建'
            };

            if (customNames[displayName]) {
                displayName = customNames[displayName];
            } else {
                displayName = displayName.replace(/_/g, ' ');
            }
    
            return sanitizeText(displayName);
        }

        let map, markerClusterGroup, countyBoundaryLayer;
        let globalData = []; 
        let serviceColumns = [];
        let isInitialLoad = true; 
        let countyGeoJsonData = null; 

        const statusEl = document.getElementById('status-message');
        const countySelect = document.getElementById('countyFilter');
        const serviceContainer = document.getElementById('serviceFilters');
        const resultCountNumber = document.getElementById('resultCountNumber');
        const resultHint = document.getElementById('resultHint');

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            setupEventListeners();
            loadDefaultData();
        });

        function initMap() {
            const taiwanBounds = L.latLngBounds(L.latLng(21.5, 118.0), L.latLng(28, 122.5));
            map = L.map('map', {
                zoomControl: false,
                maxBounds: taiwanBounds,
                maxBoundsViscosity: 1.0,
                minZoom: 7
            }).setView([23.6978, 120.9605], 8);
            
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap © CARTO',
                subdomains: 'abcd', maxZoom: 20
            }).addTo(map);

            markerClusterGroup = L.markerClusterGroup({
                chunkedLoading: true, spiderfyOnMaxZoom: true, showCoverageOnHover: false
            });
            map.addLayer(markerClusterGroup);
        }

        function updateStatus(msg, isError = false) {
            statusEl.textContent = msg;
            statusEl.className = isError ? "text-sm font-bold text-red-500 mb-2" : "text-sm font-medium text-blue-600 mb-2";
        }

        function checkAllDataLoaded() {
            if (globalData.length > 0 && countyGeoJsonData) {
                document.getElementById('upload-container').style.display = 'none';
            }
        }

        function loadDefaultData() {
            fetch(window.DATA_CONFIG.csvUrl)
                .then(res => { if (!res.ok) throw new Error(); return res.text(); })
                .then(text => { parseAndProcessCSV(text); })
                .catch(e => updateStatus('✘ 預設 CSV 載入失敗，請手動上傳', true));
            
            fetch(window.DATA_CONFIG.geoJsonUrl)
                .then(res => res.json())
                .then(data => { processGeoJson(data); })
                .catch(e => updateStatus('✘ 縣市界載入失敗，請手動上傳', true));
        }

        function processGeoJson(data) {
            if (!data || !data.features || !Array.isArray(data.features)) throw new Error('Invalid GeoJSON');
            countyGeoJsonData = data;
            drawBoundaries('all'); 
            checkAllDataLoaded();
        }

        function parseAndProcessCSV(csvString) {
            Papa.parse(csvString, {
                header: true, skipEmptyLines: true,
                complete: function(results) {
                    if (results.errors.length > 0) return updateStatus('✘ CSV 解析錯誤', true);
                    
                    const cols = results.meta.fields || [];
                    if (!['機構名稱', '縣市'].every(c => cols.includes(c))) return updateStatus('✘ 缺少必要欄位', true);
                    
                    serviceColumns = cols.filter(col => col.startsWith('藥癮_') || col.startsWith('酒癮_'));

                    globalData = results.data.reduce((acc, row) => {
                        const lat = parseFloat(row['緯度 (lat)'] || row['緯度'] || row['lat']);
                        const lng = parseFloat(row['經度 (lng)'] || row['經度'] || row['lng']);
                        
                        if (!isNaN(lat) && !isNaN(lng)) {
                            const activeServices = new Set(serviceColumns.filter(s => row[s] === 'V'));
                            const rawPhone = row['聯絡電話'] || '';
                            
                            acc.push({
                                lat: lat, 
                                lng: lng,
                                rawCounty: row['縣市'] || '', 
                                county: sanitizeText(row['縣市'] || ''), 
                                name: sanitizeText(row['機構名稱'] || '未命名機構'),
                                address: sanitizeText(row['機構地址'] || ''),
                                phoneDisplay: sanitizeText(rawPhone),
                                phoneLink: rawPhone.replace(/[^\d+()#-]/g, ''), 
                                services: activeServices
                            });
                        }
                        return acc;
                    }, []);

                    buildFilters();
                    renderMap();
                    checkAllDataLoaded();
                }
            });
        }

        function buildFilters() {
            const counties = new Set(globalData.map(item => item.rawCounty).filter(Boolean));

            const fixedCountyOrder = [
                "臺北市", "新北市", "基隆市", "桃園市",
                "新竹縣", "新竹市", "苗栗縣", "臺中市",
                "彰化縣", "南投縣", "雲林縣", "嘉義縣",
                "嘉義市", "臺南市", "高雄市", "屏東縣",
                "宜蘭縣", "花蓮縣", "臺東縣",
                "澎湖縣", "金門縣", "連江縣"
            ];
            
            while (countySelect.firstChild) countySelect.removeChild(countySelect.firstChild);
            const allOpt = document.createElement('option');
            allOpt.value = 'all'; allOpt.textContent = '全台灣所有縣市';
            countySelect.appendChild(allOpt);

            Array.from(counties).sort((a, b) => fixedCountyOrder.indexOf(a) - fixedCountyOrder.indexOf(b)).forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; opt.textContent = sanitizeText(c); 
                countySelect.appendChild(opt);
            });
            
            const drugServices = serviceColumns.filter(s => s.startsWith('藥癮_'));
            const alcoholServices = serviceColumns.filter(s => s.startsWith('酒癮_'));

            serviceContainer.innerHTML = "";
            createGroup("drug", "藥癮服務", drugServices, "indigo");
            createGroup("alcohol", "酒癮服務", alcoholServices, "orange");
        }

        function createGroup(groupKey, title, list, color) {
            const wrapper = document.createElement('div');
            wrapper.className = "mb-4 border border-slate-200 rounded-lg overflow-hidden bg-white shadow-sm";

            const header = document.createElement('div');
            header.className = `
                flex items-center justify-between px-4 py-3.5 cursor-pointer
                ${groupKey === "drug" ? "bg-indigo-50 text-indigo-800" : "bg-orange-50 text-orange-800"}
                font-bold
            `;

            const left = document.createElement('label');
            left.className = "flex items-center cursor-pointer";

            const groupCb = document.createElement('input');
            groupCb.type = "checkbox";
            groupCb.value = groupKey;
            groupCb.dataset.type = "group";
            groupCb.className = "mr-2.5 group-checkbox h-4 w-4 rounded";
            groupCb.addEventListener('change', renderMap);

            const titleSpan = document.createElement('span');
            titleSpan.className = "text-base";
            titleSpan.textContent = title;

            left.appendChild(groupCb);
            left.appendChild(titleSpan);

            const toggleIcon = document.createElement('span');
            toggleIcon.textContent = "▼";
            toggleIcon.className = "text-sm opacity-70";

            header.appendChild(left);
            header.appendChild(toggleIcon);

            const content = document.createElement('div');
            content.className = "hidden bg-white py-1 flex-col";

            list.forEach(rawKey => {
                const label = document.createElement('label');
                // 確保 Tailwind 不編譯也能生效的終極解法：使用 style 直接定義 padding
                label.className = `flex items-center py-2.5 w-full cursor-pointer hover:bg-slate-50 transition-colors`;
                label.style.paddingLeft = "2.5rem"; // 強制向右縮排 40px
                label.style.paddingRight = "1rem";

                const cb = document.createElement('input');
                cb.type = "checkbox";
                cb.value = rawKey;
                cb.dataset.type = "sub";
                cb.className = "mr-3 service-checkbox h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500";
                cb.addEventListener('change', renderMap);

                const span = document.createElement('span');
                span.textContent = getServiceDisplayName(rawKey);
                span.className = "text-base text-slate-700 font-medium";

                label.appendChild(cb);
                label.appendChild(span);
                content.appendChild(label);
            });

            header.addEventListener('click', (e) => {
                if (e.target.type === "checkbox") return;
                const isHidden = content.classList.contains("hidden");
                if (isHidden) {
                    content.classList.remove("hidden");
                    content.classList.add("flex");
                } else {
                    content.classList.add("hidden");
                    content.classList.remove("flex");
                }
                toggleIcon.textContent = isHidden ? "▲" : "▼";
            });

            wrapper.appendChild(header);
            wrapper.appendChild(content);
            serviceContainer.appendChild(wrapper);
        }

        function drawBoundaries(selectedCountyName) {
            if (!countyGeoJsonData) return;
            if (countyBoundaryLayer) map.removeLayer(countyBoundaryLayer);

            countyBoundaryLayer = L.geoJSON(countyGeoJsonData, {
                filter: feature => (selectedCountyName === 'all' || feature.properties.COUNTYNAME === selectedCountyName),
                style: feature => ({
                    color: "#64748b", weight: 2.5, opacity: 0.7,
                    fillColor: "#3b82f6", fillOpacity: selectedCountyName === 'all' ? 0.02 : 0.08 
                })
            }).addTo(map);

            if (selectedCountyName !== 'all') {
                const bounds = countyBoundaryLayer.getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, {
                        paddingTopLeft: window.innerWidth < 768 ? [10, 60] : [20, 20],
                        paddingBottomRight: [20, 20], maxZoom: 13
                    });
                }
            } else if (!isInitialLoad) {
                map.setView([23.6978, 120.9605], 8);
            }
        }

        let renderTimer;
        function debounceRenderMap() {
            clearTimeout(renderTimer);
            renderTimer = setTimeout(renderMap, 150); 
        }

        function renderMap() {
            if (globalData.length === 0) return;
            markerClusterGroup.clearLayers();

            const selectedCounty = countySelect.value;

            const checkedGroup = Array.from(document.querySelectorAll('.group-checkbox:checked'))
                .map(cb => cb.value);

            const checkedSub = Array.from(document.querySelectorAll('.service-checkbox:checked'))
                .map(cb => cb.value);

            drawBoundaries(selectedCounty);

            const filteredData = globalData.filter(item => {
                if (selectedCounty !== 'all' && item.rawCounty !== selectedCounty)
                    return false;

                let groupOK = true;

                if (checkedGroup.length > 0) {
                    groupOK = checkedGroup.some(g => {
                        if (g === "drug") {
                            return [...item.services].some(s => s.startsWith("藥癮_"));
                        }
                        if (g === "alcohol") {
                            return [...item.services].some(s => s.startsWith("酒癮_"));
                        }
                        return false;
                    });
                }

                if (!groupOK) return false;

                let subOK = true;

                if (checkedSub.length > 0) {
                    subOK = checkedSub.every(s => item.services.has(s));
                }

                if (!subOK) return false;

                return true;
            });

            filteredData.forEach(item => {
                const popupContainer = document.createElement('div');
                popupContainer.className = "w-full max-w-[300px]";

                const title = document.createElement('h3');
                title.className = "font-bold text-blue-800 text-lg mb-2 leading-tight";
                title.textContent = item.name;
                popupContainer.appendChild(title);

                const infoBox = document.createElement('div');
                infoBox.className = "bg-slate-50 p-2.5 rounded-md border border-slate-100 text-sm space-y-2 text-slate-700 mb-3";
                
                const addrP = document.createElement('p');
                addrP.className = "flex items-start";
                const addrIcon = document.createElement('span');
                addrIcon.className = "mr-1.5 mt-0.5";
                addrIcon.textContent = "📍";
                const addrText = document.createElement('span');
                addrText.textContent = `${item.county} ${item.address}`;
                addrP.appendChild(addrIcon);
                addrP.appendChild(addrText);
                infoBox.appendChild(addrP);

                if(item.phoneDisplay) {
                    const phoneP = document.createElement('p');
                    phoneP.className = "flex items-center";
                    const phoneIcon = document.createElement('span');
                    phoneIcon.className = "mr-1.5";
                    phoneIcon.textContent = "📞";
                    const phoneLink = document.createElement('a');
                    phoneLink.href = `tel:${item.phoneLink}`;
                    phoneLink.className = "text-blue-600 font-medium hover:underline";
                    phoneLink.textContent = item.phoneDisplay;
                    phoneP.appendChild(phoneIcon);
                    phoneP.appendChild(phoneLink);
                    infoBox.appendChild(phoneP);
                }
                popupContainer.appendChild(infoBox);

                if (item.services.size > 0) {
                    const tagContainer = document.createElement('div');
                    const tagHeader = document.createElement('b');
                    tagHeader.className = "text-xs text-slate-500 mb-1.5 block";
                    tagHeader.textContent = "此機構提供之服務：";
                    tagContainer.appendChild(tagHeader);

                    const tagFlex = document.createElement('div');
                    tagFlex.className = "flex flex-wrap gap-1.5";
                    
                    item.services.forEach(rawServiceKey => {
                        const isDrug = rawServiceKey.startsWith('藥癮');
                        const isAlcohol = rawServiceKey.startsWith('酒癮');
                        
                        const shortName = getServiceDisplayName(rawServiceKey);
                        
                        let prefix = "";
                        let badgeStyle = "bg-slate-50 text-slate-700 border-slate-200"; 
                        
                        if (isDrug) {
                            prefix = "[藥癮] ";
                            badgeStyle = "bg-indigo-50 text-indigo-800 border-indigo-200";
                        } else if (isAlcohol) {
                            prefix = "[酒癮] ";
                            badgeStyle = "bg-orange-50 text-orange-800 border-orange-200";
                        }
                        
                        const span = document.createElement('span');
                        span.className = `px-2 py-1 text-xs rounded-md ${badgeStyle} border font-medium`;
                        span.textContent = prefix + shortName;
                        tagFlex.appendChild(span);
                    });
                    tagContainer.appendChild(tagFlex);
                    popupContainer.appendChild(tagContainer);
                }

                const marker = L.marker([item.lat, item.lng]);
                marker.bindPopup(popupContainer, { maxWidth: 320, minWidth: 200, autoPanPadding: [15, 15] });
                markerClusterGroup.addLayer(marker);
            });

            const validCount = filteredData.length;
            resultCountNumber.textContent = validCount;
            if (validCount === 0) {
                resultCountNumber.className = "font-bold text-2xl text-amber-600";
                resultHint.classList.remove('hidden');
                document.getElementById('resetBtn').classList.add('ring-2', 'ring-amber-300', 'border-amber-400');
            } else {
                resultCountNumber.className = "font-bold text-2xl text-blue-600";
                resultHint.classList.add('hidden');
                document.getElementById('resetBtn').classList.remove('ring-2', 'ring-amber-300', 'border-amber-400');
            }
            
            isInitialLoad = false;
        }

        function setupEventListeners() {
            const toggleSidebar = () => {
                document.getElementById('sidebar').classList.toggle('-translate-x-full');
                document.getElementById('sidebarOverlay').classList.toggle('hidden');
            };

            document.getElementById('openSidebarBtn').addEventListener('click', toggleSidebar);
            document.getElementById('closeSidebarBtn').addEventListener('click', toggleSidebar);
            document.getElementById('sidebarOverlay').addEventListener('click', toggleSidebar);

            document.getElementById('csvFileInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > window.DATA_CONFIG.maxFileSize) return updateStatus('✘ CSV 檔案過大', true);
                
                updateStatus('正在處理 CSV...');
                const reader = new FileReader();
                reader.onload = e => parseAndProcessCSV(e.target.result);
                reader.readAsText(file);
            });

            document.getElementById('jsonFileInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > window.DATA_CONFIG.maxFileSize * 5) return updateStatus('✘ JSON 檔案過大', true);

                updateStatus('正在處理 JSON...');
                const reader = new FileReader();
                reader.onload = e => {
                    try { processGeoJson(JSON.parse(e.target.result)); updateStatus('✔ JSON 載入成功！'); } 
                    catch(err) { updateStatus('✘ JSON 格式錯誤', true); }
                };
                reader.readAsText(file);
            });

            countySelect.addEventListener('change', debounceRenderMap);
            
            document.getElementById('resetBtn').addEventListener('click', () => {
                countySelect.value = 'all';
                document.querySelectorAll('.service-checkbox').forEach(cb => cb.checked = false);
                document.querySelectorAll('.group-checkbox').forEach(cb => cb.checked = false);
                isInitialLoad = false; 
                renderMap();
            });
        }
    </script>
</body>
</html>
